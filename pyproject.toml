[project]
name = "mlx-transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=1.70.0",
    "mlx-whisper>=0.4.3",
    "python-dotenv>=1.0.1",
    "tenacity>=9.1.2",
    "requests>=2.31.0",
]

[project.scripts]
correct-pali = "scripts.correct_pali:main"
extract-dhamma = "scripts.extract_dhamma:main"



[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.9",
]

[lint]
ignore = []

[tool.hatch.build.targets.wheel]
packages = ["tools", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
